name: Campus Ballot Multi-Platform Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # =========================
          # Linux
          # =========================
          - os: ubuntu-latest
            platform: linux
            name: Linux-GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_output: windows-app/TheRealCampusBallot

          # =========================
          # Windows
          # =========================
          - os: windows-latest
            platform: windows
            name: Windows
            c_compiler: cl
            cpp_compiler: cl
            build_output: windows-app/TheRealCampusBallot.exe

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # -------------------------
      # Install Qt
      # -------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: "qtcharts"


      # -------------------------
      # Configure
      # -------------------------
      - name: Configure CMake
        run: >
          cmake
          -B build
          -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}


      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --config Release --parallel


      # -------------------------
      # Test
      # -------------------------
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release


      # =====================================================
      # Windows
      # =====================================================

      - name: Prepare Windows output
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p builds/windows

          # Deploy Qt runtime DLLs into builds/windows
          windeployqt "${{ matrix.build_output }}" --release --dir builds/windows

          cp "${{ matrix.build_output }}" \
             builds/windows/TheRealCampusBallot.exe


      # =====================================================
      # Linux
      # =====================================================

      - name: Prepare Linux output
        if: matrix.platform == 'linux'
        run: |
          mkdir -p builds/linux

          cp "${{ matrix.build_output }}" \
             builds/linux/TheRealCampusBallot


      # =====================================================
      # Upload artifact
      # =====================================================

      - name: Upload Windows build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: CampusBallot-Windows
          path: builds/windows/


      - name: Upload Linux build
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: CampusBallot-Linux
          path: builds/linux/