name: CMake Qt Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: "qtcharts"

      - name: Configure CMake
        run: >
          cmake
          -B build
          -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Windows app
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release --target deploy_windows_app --parallel || echo "deploy target may require windeployqt"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        run: |
          echo "Prepare artifact"
          mkdir -p builds/windows || true
          # The executable and Qt DLLs should be in windows-app/Release after deploy
          if [ -d windows-app/Release ]; then
            cp -r windows-app/Release/* builds/windows/ || true
          elif [ -d windows-app ]; then
            cp -r windows-app/* builds/windows/ || true
          else
            echo "Warning: windows-app/Release not found; attempting to copy build output"
            cp -r build/Release/* builds/windows/ || true
          fi

      - name: Upload artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: builds/windows/
